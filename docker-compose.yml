services:
  postgres:
    image: postgres:18.3
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d event_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - '${POSTGRES_PORT}:5432'
    networks:
      - isep
    volumes:
      - postgres:/var/lib/postgresql/data
    profiles:
      - 'db-standalone'
      - ''


  nestjs:
    env_file:
      - .env
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - DATABASE_URL=${POSTGRES_URL}
    ports:
      - '${BACKEND_PORT}:3100'
    networks:
      - isep
    depends_on:
      postgres:
        condition: service_healthy

    profiles:
      - 'backend-standalone'
      - ''

networks:
  isep:
    driver: bridge
volumes:
  postgres: